<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f2854" />
  <meta name="description" content="勉強したら、60秒だけ思い出す。Active Recallを習慣にする超軽量PWA。" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Recall Sprint</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">60秒思い出し</p>
        <h1>Recall Sprint</h1>
      </div>
      <button id="installBtn" class="ghost-btn install-btn" type="button" hidden>ホームに追加</button>
    </header>

    <main id="app" class="main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-btn is-active" data-route="home" type="button">
        <span class="nav-icon">⌂</span><span>ホーム</span>
      </button>
      <button class="nav-btn" data-route="history" type="button">
        <span class="nav-icon">≡</span><span>履歴</span>
      </button>
      <button class="nav-btn" data-route="about" type="button">
        <span class="nav-icon">?</span><span>使い方</span>
      </button>
    </nav>
  </div>

  <template id="toastTemplate">
    <div class="toast" role="status"></div>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
